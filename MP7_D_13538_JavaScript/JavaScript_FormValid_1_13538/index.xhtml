<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 strict//EN"
"http://www.w3.org/TR/xhtml/DTD/xhtml-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id">
<head>
    <title>Form Pendaftaran Seminar (XHTML)</title>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <script type="text/javascript">
        function fn_ValForm(){
            var sMsg = "";
            if (document.getElementById("nama").value == "") {
                sMsg += "\n*Anda belum mengisiskan nama";
            }
            if (document.getElementById("instansi").value == "") {
                sMsg += "\n*Anda belum mengisiskan instansi";
            }
            if (document.getElementById("pernyataan").value == "") {
                sMsg += "\n*Anda belum mengisiskan pernyataan";
            }
            if (sMsg != "") {
                alert("peringatan:\n" + sMsg);
                return false;
            }else{
                return true;
            }
        }
    </script>
</head>

<body>
    <h1>Form Pendaftaran Seminar</h1>
    <form action="#" method="post" onsubmit="return fn_ValForm();">
        <p>Nma Lengkap:<br /><input type="text" id="nama" name="nama" /></p>
        <p>Asal Instansi:<br /><input type="text" id="instansi" name="instansi" /></p>
        <p>Pernyataan Untuk Pembicara<br /><textarea id="pernyataan" name="pernyataan" rows="4" cols="30"></textarea></p>
        <p><input type="submit" value="send" /></p>
    </form>
</body>

</html>
